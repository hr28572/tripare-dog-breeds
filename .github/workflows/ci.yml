name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 (used by the SQLite integration tests) compiles a native
      # addon when no prebuilt binary matches; the runner has the toolchain.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint --max-warnings 0

      - name: Unit, component and SQLite integration tests
        run: npm test -- --ci

  e2e-android:
    # Real Maestro run against Expo Go on a hosted Android emulator. GitHub's Ubuntu
    # runners expose /dev/kvm, so the emulator gets hardware acceleration. The job
    # starts Metro on the runner, sideloads the Expo Go APK for SDK 57, and points
    # Expo Go at exp://10.0.2.2:8081 (the emulator's alias for the host). iOS is not
    # attempted: Maestro cannot drive a physical iPhone and macOS runners with a
    # simulator cost ~10x the Linux minutes for the same coverage.
    name: E2E (Maestro, Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download Expo Go for SDK 57
        run: |
          URL=$(curl -s https://exp.host/--/api/v2/versions | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).sdkVersions["57.0.0"].androidClientUrl))')
          echo "Expo Go: $URL"
          curl -sL "$URL" -o expo-go.apk
          ls -la expo-go.apk

      - name: Start Metro
        run: |
          CI=1 nohup npx expo start --port 8081 > metro.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -H "expo-platform: android" http://localhost:8081/ > /dev/null; then echo "Metro up after $((i*2))s"; exit 0; fi
            sleep 2
          done
          echo "Metro did not start"; cat metro.log; exit 1

      - name: Run Maestro flow on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r expo-go.apk
            adb shell pm list packages | grep host.exp.exponent
            maestro test e2e/breed-search-flow.yaml

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: |
            ~/.maestro/tests
            metro.log
          if-no-files-found: ignore
